info:
  name: Get all carts
  type: http
  seq: 1

http:
  method: GET
  url: https://fakestoreapi.com/carts
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", () => {
            expect(res.status).to.equal(200);
        });

        test("Response time", () => { expect(res.responseTime).to.be.below(1000); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
