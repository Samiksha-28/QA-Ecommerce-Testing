info:
  name: Get a single product
  type: http
  seq: 3

http:
  method: GET
  url: https://fakestoreapi.com/products/{id}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time", () => { expect(res.responseTime).to.be.below(1000); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
