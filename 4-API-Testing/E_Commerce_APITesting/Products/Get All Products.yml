info:
  name: Get All Products
  type: http
  seq: 1

http:
  method: GET
  url: https://fakestoreapi.com/products
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200", () => {
          expect(res.status).to.equal(200);
        });



        test("Response time", () => { expect(res.responseTime).to.be.below(1000); });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
